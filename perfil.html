<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Perfil</title>

<link rel="stylesheet" href="dashboard.css">

</head>

<body onload="carregarPerfil()">

<div class="perfil-page">

  <!-- TOPO -->
  <div class="perfil-topo">

    <button onclick="voltarDashboard()">
      ←
    </button>

    <h2>Tech Academy</h2>

  </div>

  <!-- PERFIL -->
  <div class="perfil-card">

    <img id="fotoPerfil">

    <input
    type="file"
    hidden
    id="uploadFoto"
    onchange="trocarFoto(event)">

    <button
    class="editar-foto"
    onclick="
    document.getElementById('uploadFoto').click()
    ">

      ✏️

    </button>

    <h1 id="nomePerfil"></h1>

    <p id="emailPerfil"></p>

  </div>

  <!-- STATUS -->
  <div class="status-card">

    <h2>⚙️ Status Ativo</h2>

    <div class="perfil-info">

      <span>
        📅 Cadastro:
        <strong id="dataCadastro"></strong>
      </span>

      <span>
        📚 Cursos:
        <strong id="totalCursos"></strong>
      </span>

      <span>
        🏆 Certificados:
        <strong id="totalCertificados"></strong>
      </span>

    </div>

  </div>

  <!-- CURSOS -->
  <div class="documentos-card">

    <h2>📚 Cursos em andamento</h2>

    <div id="listaCursos"></div>

  </div>

  <!-- CERTIFICADOS -->
  <div class="documentos-card">

    <h2>🏆 Certificados</h2>

    <div id="listaCertificados"></div>

  </div>

  <!-- EDITAR DADOS -->
  <div class="documentos-card">

    <h2>Editar Dados</h2>

    <input
    type="text"
    id="novoNome"
    placeholder="Nome">

    <input
    type="text"
    id="novoCpf"
    placeholder="CPF">

    <input
    type="date"
    id="novoNascimento">

    <input
    type="text"
    id="novoLogin"
    placeholder="Login">

    <input
    type="password"
    id="novaSenha"
    placeholder="Nova senha">

    <button onclick="salvarAlteracoes()">

      SALVAR ALTERAÇÕES

    </button>

  </div>

  <!-- DESATIVAR -->
  <div class="desativar-card">

    <h2>Desativar Conta</h2>

    <p>
      Sua conta será removida permanentemente.
    </p>

    <button
    class="btn-desativar"
    onclick="desativarConta()">

      DESATIVAR CONTA

    </button>

  </div>

  <!-- SAIR -->
  <button
class="btn-sair"
onclick="confirmarSaida()">

    SAIR

</button>

</div>

<script src="db.js"></script>
<script src="perfil.js"></script>

</body>
</html>
